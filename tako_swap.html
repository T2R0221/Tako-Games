<style>
:root{--tk:#d94a4a;--am:#e08a00;--bg:#ffffff;--ink:#1d2b3a}
*{box-sizing:border-box;touch-action:manipulation}
#board,#board *{touch-action:none}   /* board taps never pan or zoom (iPhone double-tap zoom) */
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#03081a;color:#d6ecff;font-family:'Courier New','MS Gothic',monospace;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* the page never scrolls: body is pinned to the screen and the board is sized to the space that is left (see fit()) */
body{position:fixed;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;padding:8px 12px 74px;max-width:480px;margin:0 auto;overflow:hidden}
h1{margin:2px 0 0;font-size:clamp(17px,5.2vw,26px);letter-spacing:2px;white-space:nowrap;color:var(--tk);text-align:center}
.by{font-weight:bold;font-size:clamp(12px,3.4vw,16px);letter-spacing:2px;color:#ffb703;margin-bottom:4px}
.rule{font-size:11.5px;line-height:1.5;text-align:center;color:#a9cdea;margin:2px 0 6px}
.rule b{color:#ffc94d}
.bar#sizes .btn,.bar#diffs .btn{font-size:12px;padding:4px 10px}
.bar#sizes,.bar#diffs{margin:1px 0 3px}
.bar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:2px 0 6px}
.btn{font:inherit;font-size:12px;letter-spacing:1px;color:#ffc94d;background:rgba(5,12,30,.75);border:2px solid #ffb703;padding:6px 10px;border-radius:6px;cursor:pointer}
.btn:active{transform:translateY(1px);background:rgba(40,30,0,.85)}
.btn.sel{background:#ffb703;color:#1d2b3a}
.btn.off{opacity:.4}
#quit{color:#ff2e88;border-color:#ff2e88}
#totitle{color:#ff2e88 !important;border-color:#ff2e88 !important;text-shadow:0 0 6px #ff2e88 !important;box-shadow:0 0 10px rgba(255,46,136,.35) !important}
.info{display:flex;gap:16px;font-size:13px;color:#5ff0e0;margin-bottom:2px;align-items:center}
.miss b{color:#ff5252;letter-spacing:2px}
.miss i{font-style:normal;color:#4a5b78;letter-spacing:2px}
#msg{min-height:30px;font-size:12px;line-height:1.5;text-align:center;color:#ff8a80;margin-bottom:4px}
#bg{position:fixed;left:50%;top:0;transform:translateX(-50%);width:min(100%,480px);height:100%;z-index:0;opacity:1;pointer-events:none}
body>*:not(#bg):not(script){position:relative;z-index:1}
#board{display:grid;gap:5px;padding:6px;border-radius:16px;width:min(94vw,460px,calc(100vh - 430px));min-width:250px;aspect-ratio:1;border:none;box-shadow:0 0 0 2px rgba(120,160,210,.45);background:transparent}
.c{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:16%}
.c .x{width:46%;height:46%;opacity:.85}
.c .o{width:78%;height:78%;background:var(--mascot) center/contain no-repeat;image-rendering:pixelated}
.c.miss1{cursor:default}
.c.miss1 .x{width:58%;height:58%;opacity:1;animation:pop .25s}
@keyframes pop{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
.win .o{animation:wig .5s infinite alternate}
@keyframes wig{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-6%) rotate(6deg)}}
#clear{position:fixed !important;top:0;bottom:0;left:50%;width:min(100%,480px);transform:translateX(-50%);background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9;text-align:center;padding:16px;box-sizing:border-box}
#clear h2{margin:0;font-size:clamp(20px,5.6vw,36px);letter-spacing:2px;color:#26ffe6;text-shadow:0 0 12px #26ffe6,0 0 2px #fff}
#clear h2.over{color:#ff2e88;text-shadow:0 0 12px #ff2e88,0 0 2px #fff}
#clear .btnrow{display:flex;gap:12px;justify-content:center}
#clear button.arcade{font:inherit;font-size:16px;letter-spacing:2px;background:transparent;color:#ffb703;border:2px solid #ffb703;padding:10px 22px;border-radius:10px;text-shadow:0 0 6px #ffb703;box-shadow:0 0 10px rgba(255,183,3,.4);cursor:pointer}
#clear button.arcade:active{transform:scale(.96)}
#next{color:#26ffe6 !important;border-color:#26ffe6 !important;text-shadow:0 0 6px #26ffe6 !important;box-shadow:0 0 10px rgba(38,255,230,.35) !important}
#clear p{margin:4px 0;color:#9ff;font-size:13px;max-width:320px}
.foot{position:fixed !important;left:50%;width:min(100%,480px);transform:translateX(-50%);bottom:6px;font-size:11.5px;color:#9fb8d6;text-align:center;line-height:1.4}

/* ---- opening (title screen) ---- */
#title{position:fixed !important;top:0;bottom:0;left:50%;width:min(100%,480px);transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:0 0 126px;box-sizing:border-box}
#title .top{width:100%;padding:44px 14px 36px;background:linear-gradient(to bottom,rgba(3,8,26,.93) 0,rgba(3,8,26,.93) 70%,rgba(3,8,26,0) 100%)}
#title .bottom{width:100%;padding:26px 14px 14px;background:linear-gradient(to bottom,rgba(3,8,26,0) 0,rgba(3,8,26,.9) 26%,rgba(3,8,26,.9) 82%,rgba(3,8,26,0) 100%);display:flex;flex-direction:column;align-items:center;gap:5px}
#title h1{margin:0;font-size:clamp(20px,6vw,32px);line-height:1.25;letter-spacing:3px;color:#e05a5a;text-shadow:0 0 12px #e05a5a,0 0 2px #fff;white-space:normal}
#title h1 .ch{display:inline-block;animation:chIn .95s cubic-bezier(.2,.7,.3,1) both}
@keyframes chIn{0%{transform:translateY(-190px);opacity:0}8%{opacity:1}55%{transform:translateY(0)}70%{transform:translateY(-22px)}85%{transform:translateY(0)}93%{transform:translateY(-6px)}100%{transform:translateY(0)}}
#title .by{font-size:clamp(15px,4.4vw,24px);font-weight:bold;letter-spacing:3px;color:#ffb703;text-shadow:0 0 10px #ffb703,0 0 2px #fff;margin:10px 0 0;opacity:0;animation:byIn .8s 1.5s forwards}
@keyframes byIn{to{opacity:.95}}
#title p{margin:0;max-width:380px;line-height:1.55}
#title p.jp{font-size:clamp(10.5px,3.1vw,13px);color:#d6fffa;white-space:nowrap}
#title p.en{font-size:12px;color:#7fd8d0;white-space:nowrap}
button.arcade{font-family:inherit;font-size:16px;letter-spacing:2px;background:transparent;color:#ffb703;border:2px solid #ffb703;padding:10px 26px;border-radius:10px;text-shadow:0 0 6px #ffb703;box-shadow:0 0 10px rgba(255,183,3,.4);cursor:pointer;margin:4px 0 0;animation:pulse 1.4s infinite alternate}
button.arcade:active{transform:scale(.96)}
@keyframes pulse{from{box-shadow:0 0 6px rgba(255,183,3,.3)}to{box-shadow:0 0 16px rgba(255,183,3,.8)}}
body.opening #board{width:min(42vw,170px);min-width:0;margin:0 auto}
@media (min-width:600px){ body.opening #board{width:min(42vw,170px)} }
@media (max-height:780px){.rule{display:none}.foot{font-size:10px}}
#title .homelink{display:inline-block;margin-top:2px;font-family:inherit;font-size:12px;letter-spacing:1px;color:#26ffe6;text-decoration:none;border:1px solid #26ffe6;border-radius:6px;padding:5px 10px;background:rgba(2,20,30,.7)}
body.opening h1.main,body.opening .by.main,body.opening .rule,body.opening #sizes,body.opening .info,body.opening #msg,body.opening .bar,body.opening .foot{visibility:hidden}
@media (prefers-reduced-motion:reduce){#title h1 .ch,#title .by{animation:none;opacity:1}}

/* ---- TAKO SWAP ---- */
#field{width:min(94vw,460px);aspect-ratio:8/5;touch-action:none;position:relative;margin:4px auto 0}
#field *{touch-action:none}
#fs{width:100%;height:100%;display:block;overflow:visible}
#lines line{stroke:#7fd8ff;stroke-width:5;stroke-linecap:round;opacity:.85}
.hm{stroke-width:2;fill-opacity:.12;stroke-opacity:.6}
.hr{fill:#ff5a5a;stroke:#ff5a5a}.hb{fill:#4a90ff;stroke:#4a90ff}
.nd{fill:#0b1f3a;stroke:#7fd8ff;stroke-width:3}
.hit{fill:transparent;cursor:pointer}
.pc{pointer-events:none}
.pc image{image-rendering:pixelated}
.pc .shadow{fill:rgba(0,0,0,.35)}
.pc.sel image{animation:hop .5s infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.ring{fill:none;stroke:#26ffe6;stroke-width:3;stroke-dasharray:6 5}
.tg{fill:rgba(255,183,3,.25);stroke:#ffb703;stroke-width:3;animation:pls .7s infinite alternate}
@keyframes pls{from{opacity:.45}to{opacity:1}}
.win.w0 .pc.s0 image,.win.w1 .pc.s1 image{animation:wig .5s infinite alternate}
@keyframes wig{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-6px) rotate(6deg)}}
#turn{min-height:24px;font-size:14px;color:#d6fffa;display:flex;align-items:center;gap:6px;justify-content:center}
#turn .ti{width:18px;height:20px;image-rendering:pixelated}
.info b{color:#5ff0e0}
#clear h2.draw{color:#ffb703;text-shadow:0 0 12px #ffb703,0 0 2px #fff}
.cap{font-size:12px;color:#a9cdea;text-align:center;margin-top:2px}
body.opening #turn,body.opening .cap,body.ended .cap{visibility:hidden}
#clear #next{display:none}

(function(){
function countO(){return 0}var N=1;
/* ===== TAKO SWAP engine: 12 nodes (x 0..3, y 0..2), id = x*3+y ===== */
var ADJ=(function(){
  var a=[];for(var i=0;i<12;i++)a.push([]);
  function e(p,q){a[p].push(q);a[q].push(p)}
  function id(x,y){return x*3+y}
  for(var y=0;y<3;y++){e(id(0,y),id(1,y));e(id(2,y),id(3,y))}
  for(var x=0;x<4;x++)for(var y=0;y<2;y++)e(id(x,y),id(x,y+1));
  e(id(1,1),id(2,1));
  return a;
})();
var RED0=7,BLU0=(1<<9)|(1<<10)|(1<<11);   /* bit masks: red at x=0 (ids 0,1,2), blue at x=3 (ids 9,10,11) */
var GOALM=[BLU0,RED0];                      /* player 0 (red) wins on blue's start column, and vice versa */
function bits(m){var o=[];for(var i=0;i<12;i++)if(m>>i&1)o.push(i);return o}
/* legal moves for player t in state (r,b): list of [from,to] */
function legal(r,b,t){
  var me=t?b:r,op=t?r:b,o=[],ps=bits(me);
  for(var k=0;k<ps.length;k++){var p=ps[k],n=ADJ[p];
    for(var j=0;j<n.length;j++){var q=n[j];if(!(me>>q&1)&&!(op>>q&1))o.push([p,q])}}
  return o;
}
function apply(r,b,t,mv){
  var f=1<<mv[0],to=1<<mv[1];

}
function winner(r,b){return r===GOALM[0]?0:(b===GOALM[1]?1:-1)}
/* ---- exact solution by retrograde analysis (W/L from the viewpoint of the player to move) ---- */
var SOLVED=null;
function solveAll(){
  if(SOLVED)return SOLVED;
  var key=function(r,b,t){return (r<<13)|(b<<1)|t};
  var res=new Map(),dep=new Map(),cnt=new Map(),pred=new Map(),all=[];
  var combo=[];for(var m=0;m<4096;m++){var c=0,x=m;while(x){c+=x&1;x>>=1}if(c===3)combo.push(m)}
  combo.forEach(function(r){combo.forEach(function(b){if(r&b)return;[0,1].forEach(function(t){all.push([r,b,t])})})});
  var q=[];

    var r=s[0],b=s[1],t=s[2],k=key(r,b,t),w=winner(r,b);
    if(w>=0){res.set(k,w===t?'W':'L');dep.set(k,0);q.push(k);return}
    var mv=legal(r,b,t);
    if(!mv.length)mv=[null];                       /* blocked: the turn is passed */
    cnt.set(k,mv.length);

/* progress heuristic: how far each own piece is toward the goal column */
function prog(m,t){var s=0,ps=bits(m);for(var i=0;i<ps.length;i++){var x=ps[i]/3|0;s+=t?(3-x):x}return s}

function rnd(n){return Math.floor(Math.random()*n)}
/* ---- CPU players: 'easy' | 'normal' | 'hard' ---- */
function pickMove(r,b,t,level){
  var mv=legal(r,b,t);if(!mv.length)return null;
  /* always take an immediate win */
  for(var i=0;i<mv.length;i++){var n=apply(r,b,t,mv[i]);if(winner(n[0],n[1])===t)return mv[i]}
  if(level==='easy'){
    if(Math.random()<.5){ /* a forward step */
      var best=-99,bm=[];mv.forEach(function(m){var n=apply(r,b,t,m),v=prog(t?n[1]:n[0],t);if(v>best){best=v;bm=[m]}else if(v===best)bm.push(m)});

  /* hard: perfect play from the solved table */

  if(D.length){
    var best2=-99,bm2=[];D.forEach(function(o){var v=prog(t?o.n[1]:o.n[0],t)*2+evalState(o.n[0],o.n[1],t)*0+Math.random();if(v>best2){best2=v;bm2=[o]}});
    return bm2[0].m}
  L.sort(function(a,b){return b.d-a.d});return L[0].m;
}
function nega(r,b,t,d,al,be){
  var w=winner(r,b);if(w>=0)return w===t?1000+d:-1000-d;
  if(d===0)return evalState(r,b,t);
  var mv=legal(r,b,t);if(!mv.length)return -nega(r,b,1-t,d-1,-be,-al);

  for(var i=0;i<mv.length;i++){var n=apply(r,b,t,mv[i]),v=-nega(n[0],n[1],1-t,d-1,-be,-al);
    if(v>best)best=v;if(best>al)al=best;if(al>=be)break}
  return best;
}

  gain.gain.setValueAtTime((vol!==undefined?vol:0.15), t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);

  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }

    for(let i=0;i<n;i++) d[i] = Math.random()*2-1;

  const s = actx.createBufferSource(); s.buffer = voiceNoise;

/* ---- seabed picture (ported from TAKO TAKO LANDING), drawn faintly behind everything ---- */
const POT_C = 4;                                   // cell size in px
let potBackCv = null, potFrontCv = null;
function buildPotSprites(){
  const C = POT_C;
  // --- front: body of the pot, mouth open on the left edge (x = 0) ---
  const FW = 26, FH = 20;                           // 104 x 80 px
  const fc = document.createElement("canvas"); fc.width = FW*C; fc.height = FH*C;
  const g = fc.getContext("2d");
  const half = px => px < 45 ? 26 + 12*Math.sin(px/45*Math.PI/2) : 38*Math.sqrt(Math.max(0, 1-((px-45)/57)**2));
  const fill = Array.from({length:FH}, ()=>Array(FW).fill(false));
  for(let j=0;j<FH;j++) for(let i=0;i<FW;i++){
    const yc = (j+0.5-FH/2)*C;                      // relative to the pot centre line
    if(Math.abs(yc) <= half(i*C+C/2)) fill[j][i] = true;
  }
  const edge = (i,j)=> !fill[j][i] ? false :
    (j===0 || !fill[j-1][i] || j===FH-1 || !fill[j+1][i] || i===FW-1 || !fill[j][i+1]);
  const shade = ["#f2b479","#dc8f56","#dc8f56","#c67444","#c67444","#b4623a","#b4623a","#a2552f","#a2552f","#8a4429",
                 "#8a4429","#7a3a25","#7a3a25","#6f3524"];  // top -> bottom (by relative position)
  for(let j=0;j<FH;j++) for(let i=0;i<FW;i++){
    if(!fill[j][i]) continue;
    let col;
    if(edge(i,j)) col = "#2e140e";
    else {
      const rel = (j+0.5)/FH;                      // 0 top .. 1 bottom
      col = shade[Math.min(shade.length-1, Math.floor(rel*shade.length))];
    }
    g.fillStyle = col; g.fillRect(i*C, j*C, C, C);
  }
  // top outline along the open mouth edge is kept, only the left edge stays open
  // rope bands (two curved rows of cream cells around the neck)
  g.fillStyle = "#ead9a6";
  for(const bi of [5,7]){
    for(let j=1;j<FH-1;j++){
      const bow = Math.round(Math.sin((j/(FH-1))*Math.PI)*1.2);   // slight curve
      const i = bi + bow;
      if(fill[j][i] && !edge(i,j)) g.fillRect(i*C, j*C, C, C);
    }
  }
  // glaze highlight + a few speckles
  g.fillStyle = "rgba(255,240,215,0.55)";
  for(let i=11;i<=16;i++) g.fillRect(i*C, 3*C, C, C);
  for(let i=13;i<=15;i++) g.fillRect(i*C, 2*C, C, C);
  g.fillStyle = "rgba(60,25,15,0.35)";
  [[18,12],[21,9],[12,14],[19,15],[15,11]].forEach(([i,j])=>{ if(fill[j][i] && !edge(i,j)) g.fillRect(i*C, j*C, C, C); });
  potFrontCv = fc;

  // --- back: dark inside of the mouth (vertical ellipse, 10 x 26 px radii) ---
  const BW_ = 6, BH_ = 14;                          // 24 x 56 px, centred on the mouth
  const bc = document.createElement("canvas"); bc.width = BW_*C; bc.height = BH_*C;
  const h = bc.getContext("2d");
  const inE = (i,j)=>{ const x=(i+0.5-BW_/2)*C/10, y=(j+0.5-BH_/2)*C/26; return x*x+y*y <= 1; };
  for(let j=0;j<BH_;j++) for(let i=0;i<BW_;i++){
    if(!inE(i,j)) continue;
    const rim = !(i>0&&inE(i-1,j)&&i<BW_-1&&inE(i+1,j)&&j>0&&inE(i,j-1)&&j<BH_-1&&inE(i,j+1));
    h.fillStyle = rim ? "#e3a56f" : "#07030f"; h.fillRect(i*C, j*C, C, C);
  }
  potBackCv = bc;
}

    if(p.side!==mySide){errBeep('そのタコは動かせません / Not your octopus');return}
    if(sel===n){sel=-1;markSel();return}
    if(!ADJ[n].some(function(j){return !pieceAt(j)})){sel=n;markSel();errBeep('このタコは動けません / This one is blocked');sel=-1;setTimeout(markSel,0);return}
    sel=n;beep(520,.04);markSel();return;
  }
  /* empty node: move the selected piece if it can reach it, otherwise the one piece of mine that can */
  if(sel>=0&&ADJ[sel].indexOf(n)>=0){doMove(sel,n);return}
  var c=ADJ[n].filter(function(j){var q=pieceAt(j);return q&&q.side===mySide});
  if(c.length===1){doMove(c[0],n);return}
  if(c.length===0){errBeep('そこへは動けません / Can\'t move there');return}
  errBeep('先にタコをタップ / Tap an octopus first');
}
function doMove(from,to){
  var p=pieceAt(from),side=p.side;
  var nr=apply(r,b,side,[from,to]);r=nr[0];b=nr[1];
  p.node=to;sel=-1;markSel();place(p,true);
  var home=GOALM[side]>>to&1;
  if(!demo){if(home)playSmp('tk',.9)||beep(420,.08);else beep(330,.06)}
  plies++;
  var w=winner(r,b);
  if(w>=0){finish(w);return}
  if(plies>=CAP*2){finish(-1);return}
  turn=1-turn;setTurnUI();
  nextTurn();
}
function nextTurn(){
  var mv=legal(r,b,turn);
  if(!mv.length){   /* blocked: the turn is passed */
    busy=true;
    if(!demo)flash((turn?'青':'赤')+'は動けない！パス / '+(turn?'Blue':'Red')+' is blocked - pass');
    cpuT=setTimeout(function(){busy=false;plies++;if(plies>=CAP*2){finish(-1);return}turn=1-turn;setTurnUI();nextTurn()},demo?300:1100);
    return;
  }
  if(!isHuman(turn)||demo)cpuTurn();
}
function cpuTurn(){
  busy=true;
  cpuT=setTimeout(function(){
    if(over&&!demo)return;
    var lv=demo?'normal':level,m=pickMove(r,b,turn,lv);
    busy=false;
    if(!m){nextTurn();return}
    var p=pieceAt(m[0]);
    if(!demo){sel=m[0];markSel()}
    cpuT=setTimeout(function(){if(!demo&&over)return;if(!demo)sel=-1;doMove(m[0],m[1])},demo?0:220);
  },demo?520:720);
}
function finish(w){
  over=true;busy=true;clearTimeout(cpuT);setTurnUI();
  if(demo){cpuT=setTimeout(function(){if(demo)newDemo()},1800);return}
  $('field').className=w>=0?'win w'+w:'';
  var ttl,cls='',txt;
  if(w<0){ttl='DRAW';cls='draw';txt='引き分け / '+CAP+' turns each';tone(300,.25,'square',.12,260)}
  else if(mode==='1p'){
    if(w===0){ttl='YOU WIN!';txt='赤タコがそろった！ / All 3 octopuses home!';clearVoice()}
    else{ttl='GAME OVER';cls='over';txt='青（CPU）の勝ち / CPU wins';tone(300,0.9,'sawtooth',0.2,60);playSmp('to',1,0.35)||0}   /* game-over sweep (same as INVADERS) + TA-KOOO-N */
  }else{ttl=(w?'BLUE':'RED')+' WINS!';txt=(w?'青':'赤')+'タコの勝ち！ / '+(w?'Blue':'Red')+' wins';clearVoice()}
  setTimeout(function(){document.body.classList.add('ended');$('ctt').textContent=ttl;$('ctt').className=cls;$('ct').textContent=txt;$('clear').style.display='flex'},w<0?500:900);
}
var ft=0;
function flash(t,sticky){$('msg').innerHTML='⚠ '+t;clearTimeout(ft);if(!sticky)ft=setTimeout(function(){$('msg').innerHTML=''},1600)}
function clearMsg(){clearTimeout(ft);$('msg').innerHTML=''}
function modes(){
  var s=$('modes');s.innerHTML='';
  [['1p','1人で CPUと'],['2p','2人で']].forEach(function(d){
    var bt=document.createElement('button');bt.className='btn'+(d[0]===mode?' sel':'');bt.textContent=d[1];
    bt.onclick=function(){mode=d[0];try{localStorage.setItem('tako_swap_mode',mode)}catch(e){}modes();diffs();newGame()};s.appendChild(bt)});
}
function diffs(){
  var s=$('diffs');s.innerHTML='';s.style.display=mode==='1p'?'':'none';
  [['easy','やさしい'],['normal','ふつう'],['hard','むずかしい']].forEach(function(d){
    var bt=document.createElement('button');bt.className='btn'+(d[0]===level?' sel':'');bt.textContent=d[1];
    bt.onclick=function(){level=d[0];try{localStorage.setItem('tako_swap_lv',level)}catch(e){}diffs();newGame()};s.appendChild(bt)});
  fit();
}
/* ---- opening demo: two CPUs play on the real board ---- */
function newDemo(){clearTimeout(cpuT);demo=true;r=RED0;b=BLU0;turn=0;plies=0;sel=-1;over=false;busy=false;buildField();mkPieces();markSel();setTurnUI();$('field').className='';fit();cpuTurn()}
function bounceTitle(){
  var h=$('th'),i=0;
  h.innerHTML=THEME.titleLines.map(function(line){return line.split('').map(function(ch){
    return ch===' '?'&nbsp;':'<span class="ch" style="animation-delay:'+(0.1+(i++)*0.07).toFixed(2)+'s">'+ch+'</span>'}).join('')}).join('<br>');
  var by=document.querySelector('#title .by');by.style.animation='none';void by.offsetWidth;by.style.animation='';
}
function startGame(){
  demo=false;clearTimeout(cpuT);
  document.body.classList.remove('opening');$('title').style.display='none';
  audioInit();newGame();
  whenAudioReady(clearVoice);
  if(level==='hard')setTimeout(solveAll,50);
}
function goTitle(){
  clearTimeout(cpuT);clearMsg();$('clear').style.display='none';
  document.body.classList.add('opening');$('title').style.display='flex';
  newDemo();bounceTitle();
}
$('start').onclick=startGame;$('quit').onclick=goTitle;$('totitle').onclick=goTitle;
$('retry').onclick=newGame;$('new').onclick=newGame;
$('snd').onclick=function(){soundOn=!soundOn;sfxMuted=!soundOn;applyMute();this.textContent='♪ SOUND '+(soundOn?'ON':'OFF');this.classList.toggle('off',!soundOn);if(soundOn){audioInit();tone(880,.06,'square',.1,1200)}};
window.addEventListener('resize',function(){drawSea();fit()});window.addEventListener('orientationchange',function(){setTimeout(function(){drawSea();fit()},200)});
document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
var lastTE=0;
document.addEventListener('touchend',function(e){var t=Date.now();if(t-lastTE<350&&!(e.target.closest&&e.target.closest('button')))e.preventDefault();lastTE=t},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},{passive:false})});
preloadAudio();drawSea();modes();diffs();bounceTitle();newDemo();
window.__t={tapNode:tapNode,get state(){return {r:r,b:b,turn:turn,plies:plies,over:over,sel:sel}},legal:legal,startGame:startGame,pickMove:pickMove,setMode:function(m){mode=m;modes();diffs()},setLevel:function(l){level=l}};

})();
</script>
</body>
